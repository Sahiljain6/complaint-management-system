{% extends 'base.html' %}
{% block content %}

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="stat-card stat-total">
      <h6>Total Complaints</h6>
      <h3>{{ stats.total }}</h3>
    </div>
  </div>
  <div class="col-md-4">
    <div class="stat-card stat-pending">
      <h6>Pending</h6>
      <h3>{{ stats.pending }}</h3>
    </div>
  </div>
  <div class="col-md-4">
    <div class="stat-card stat-resolved">
      <h6>Resolved</h6>
      <h3>{{ stats.resolved }}</h3>
    </div>
  </div>
</div>

<div class="mb-3">
  <a href="/add" class="btn btn-primary me-2">+ Add Complaint</a>
  <a href="/track" class="btn btn-outline-secondary">Track Complaint</a>
</div>

{% for c in complaints %}
<div class="card p-4 mb-3">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h6 class="mb-1">#{{ c.id }} — {{ c.title }}</h6>
      <p class="text-muted mb-2">{{ c.description }}</p>
    </div>
    <span class="badge {{ 'bg-warning' if c.status=='Pending' else 'bg-success' }}">
      {{ c.status }}
    </span>
  </div>
</div>
{% endfor %}

{% endblock %}
