{% extends 'base.html' %}
{% block content %}

<div class="card p-4 shadow-sm border-0 mx-auto" style="max-width:720px;">
  <h4 class="mb-2">Submit a New Complaint</h4>
  <p class="text-muted mb-4">Upload a supporting screenshot or PDF to help us resolve it faster.</p>

  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" name="title" placeholder="Complaint Title" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select class="form-select" name="category" required>
        <option value="Technical">Technical</option>
        <option value="Academic">Academic</option>
        <option value="Hostel">Hostel</option>
        <option value="Admin">Admin</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="5" placeholder="Describe the issue..." required></textarea>
    </div>
    <div class="mb-4">
      <label class="form-label">Attachment (Image or PDF)</label>
      <input class="form-control" type="file" name="attachment" accept=".png,.jpg,.jpeg,.gif,.pdf" required>
    </div>
    <button class="btn btn-primary">Submit Complaint</button>
  </form>
</div>

{% endblock %}
