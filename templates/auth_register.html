{% extends "base.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="auth-logo">
        <i class="bi bi-person-plus"></i>
      </div>
      <div class="text-center mb-4">
        <h3 class="mb-1">Create Account</h3>
        <p class="text-muted mb-0">Register to submit and track complaints in real time.</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" placeholder="Choose a username" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="Create a secure password" required>
        </div>
        <button class="btn btn-primary w-100">Create Account</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted">Already have an account?</span>
        <a href="{{ url_for('login') }}" class="fw-semibold">Sign in</a>
      </div>
      <div class="text-center mt-4 text-muted small">
        By registering, you agree to the platform usage policy.
      </div>
    </div>
  </div>
</div>
{% endblock %}
