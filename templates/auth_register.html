{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-4 col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="text-center mb-1">Create Account</h4>
        <p class="text-center text-muted mb-4">Register to raise and track complaints.</p>
        <form method="post">
          <input class="form-control mb-3" name="username" placeholder="Username" required>
          <input class="form-control mb-4" type="password" name="password" placeholder="Password" required>
          <button class="btn btn-primary w-100">Register</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('login') }}">Already have an account?</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
