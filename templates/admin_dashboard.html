{% extends 'base.html' %}
{% block content %}

<h4 class="mb-4">Admin Dashboard</h4>

{% for c in complaints %}
<div class="card p-4 mb-3">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h6>#{{ c.id }} | {{ c.user }}</h6>
      <p class="mb-1 fw-medium">{{ c.title }}</p>
      <p class="text-muted">{{ c.description }}</p>
    </div>

    {% if c.status == 'Pending' %}
      <a href="/resolve/{{ c.id }}" class="btn btn-success btn-sm">Resolve</a>
    {% else %}
      <span class="badge bg-success">Resolved</span>
    {% endif %}
  </div>
</div>
{% endfor %}

{% endblock %}
