<!DOCTYPE html>
<html>
<head>
  <title>Smart Complaint System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 py-3">
  <span class="navbar-brand fw-semibold">Smart Complaint System</span>
  <div class="ms-auto">
    <a href="/logout" class="btn btn-light btn-sm">Logout</a>
  </div>
</nav>

<div class="container my-4">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }} shadow-sm rounded-3">
      {{ message }}
    </div>
  {% endfor %}
{% endwith %}

{% block content %}{% endblock %}
</div>

</body>
</html>
